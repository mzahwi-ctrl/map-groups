<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Learning Groups based on MAP Data</title>
<style>
  :root{--ink:#17202B;--muted:#5A6576;--bg:#F4F5F7;--card:#fff;--line:#E1E4E8;--navy:#1D2B5C}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:max(18px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 36px max(14px,env(safe-area-inset-left))}
  main{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .head{background:var(--navy);color:#fff;border-radius:14px;padding:16px 20px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between}
  .head h1{margin:0;font-size:26px;line-height:1.15}
  .head .eye{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.8;font-weight:700}
  .head .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;margin-top:6px}
  .head .meta b{color:#FFD86B;font-weight:700}
  .tools{display:flex;gap:8px}
  .btn{border:0;border-radius:8px;background:#fff;color:var(--navy);font:700 14px inherit;padding:9px 14px;cursor:pointer}
  .cuts{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:14px}
  .cuts .t{font-weight:700}
  .chip{display:inline-flex;align-items:center;gap:6px}
  .chip i{width:12px;height:12px;border-radius:3px;background:var(--gc)}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .grp{background:var(--card);border:3px solid var(--gc);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .grp-h{background:var(--gc);color:var(--gf);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .grp-h h2{margin:0;font-size:20px}
  .grp-h .n{background:#fff;color:#111;border-radius:99px;padding:2px 12px;font-weight:800;font-size:14px;white-space:nowrap}
  .grp-i{padding:10px 14px;font-size:13.5px;border-bottom:1px solid var(--line);background:var(--gb);display:flex;flex-direction:column;gap:3px}
  .grp-i b{color:#111}
  table{width:100%;border-collapse:collapse;font-size:14.5px}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:7px 12px;border-bottom:2px solid var(--line)}
  td{padding:7px 12px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:0}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  td.num{font-weight:800}
  td.i{color:var(--muted);width:30px}
  .star{font-size:12px;font-weight:700;background:#fff;color:#7A5A00;border-radius:99px;padding:1px 8px;margin-left:6px}
  .miss{background:var(--card);border:1px dashed #999;border-radius:12px;padding:10px 14px;font-size:14px}
  .msg{background:var(--card);border-radius:12px;padding:20px;color:var(--muted)}
  footer{margin-top:20px;color:var(--muted);font-size:12.5px;text-align:center}
  @media (max-width:760px){.grid{grid-template-columns:1fr}.head h1{font-size:22px}}
  @media print{
    body{background:#fff;padding:0;font-size:12px}.tools{display:none}
    .head{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .grp,.grp-h,.grp-i,.chip i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .grp{break-inside:avoid}.grid{gap:10px}main{gap:10px}
    @page{size:A4;margin:10mm}
  }
</style>
</head>
<body>
<main id="app"><div class="msg">Open this page from the “Learning Groups based on MAP Data” link in a Weekly Plan.</div></main>
<footer>DSK Math Arena · Dubai Schools Al Khawaneej</footer>
<script>
(function(){
  var G=[
    {k:"Foundations",c:"#D23A30",f:"#fff",b:"#FCEDEC"},
    {k:"Developing",c:"#F2C82A",f:"#2B1F00",b:"#FEF8E1"},
    {k:"Proficient",c:"#2F8A3A",f:"#fff",b:"#EAF5EC"},
    {k:"Advanced",c:"#3A6FB0",f:"#fff",b:"#EAF0F8"}];
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function decode(s){
    s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";
    var bin=atob(s),bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function gi(name){name=String(name||"").toLowerCase();for(var i=0;i<4;i++)if(name.indexOf(G[i].k.toLowerCase())===0)return i;return -1}
  /* older links: {k:'MAP GROUPS', s, h, l:[lines]} */
  function fromLegacy(d){
    var out={sub:d.s||"",ses:d.h||"",groups:[[],[],[],[]].map(function(){return{st:[]}}),miss:[]};
    (d.l||[]).forEach(function(line){
      line=String(line);
      if(/^Not placed yet/i.test(line)){out.miss=line.replace(/^[^:]*:\s*/,"").split(/,\s*/);return}
      var p=line.split(" · ");
      var m=p[0].match(/^([A-Za-z]+):\s*(.*)$/);
      if(m&&gi(m[1])>-1&&p.length>=3&&/^RIT /.test(p[p.length-1])){
        out.groups[gi(m[1])].st.push([m[2],p[1]==="—"?"":p[1],p[p.length-1].replace(/^RIT\s*/,"")]);return}
      var g=gi(p[0].split(" ")[0]);if(g<0)return;var o=out.groups[g];
      p.slice(1).forEach(function(x){
        if(/^RIT /.test(x))o.range=x.replace(/^RIT\s*/,"");
        else if(/^Skill:/.test(x))o.skill=x.replace(/^Skill:\s*/,"");
        else if(/^Today:/.test(x))o.now=x.replace(/^Today:\s*/,"");
        else if(/^Home:/.test(x))o.home=x.replace(/^Home:\s*/,"");
      });
    });
    var cm=out.sub.match(/cut-offs (.*)$/);if(cm){out.cuts=cm[1];out.sub=out.sub.replace(/\s*·\s*Grade \d+ cut-offs.*$/,"")}
    var gm=d.s&&d.s.match(/Grade (\d+) cut-offs/);if(gm)out.grade=gm[1];
    out.title=out.sub.split(" · ")[0]||"Class";
    return out;
  }
  /* current links: {v:2, c, sec, unit, area, season, grade, teacher, no, date, topic, cuts:[a,b,c], g:[{range,skill,now,home,st:[[n,k,r]]}], miss:[]} */
  function fromV2(d){
    var sub=[d.unit,d.area,d.season?"MAP "+d.season:""].filter(Boolean).join(" · ");
    return {title:d.c,sec:d.sec,sub:sub,area:d.area,unit:d.unit,teacher:d.teacher,grade:d.grade,season:d.season,
      ses:"Session "+(d.no||"")+(d.date?" · "+d.date:"")+(d.topic?" · "+d.topic:""),
      cuts:d.cuts&&d.cuts.length===3?("41st "+d.cuts[0]+", 61st "+d.cuts[1]+", 81st "+d.cuts[2]):"",
      groups:(d.g||[]).map(function(x){return x||{st:[]}}),miss:d.miss||[]};
  }
  function render(){
    var app=document.getElementById("app"),h=location.hash.slice(1);if(!h)return;
    var d;try{d=decode(h)}catch(e){app.innerHTML='<div class="msg">This link could not be read. Download the Weekly Plan again from DSK Math Arena.</div>';return}
    var D=d.v===2?fromV2(d):fromLegacy(d);
    document.title="Learning Groups – "+(D.title||"MAP");
    var meta=[];
    if(D.sec)meta.push("<span>"+esc(D.sec)+"</span>");
    if(D.area)meta.push("<span>Instructional area: <b>"+esc(D.area)+"</b></span>");
    if(D.unit)meta.push("<span>"+esc(D.unit)+"</span>");
    if(!D.area&&D.sub)meta.push("<span>"+esc(D.sub)+"</span>");
    if(D.teacher)meta.push("<span>Teacher: <b>"+esc(D.teacher)+"</b></span>");
    if(D.ses)meta.push("<span>"+esc(D.ses)+"</span>");
    var html='<header class="head"><div><div class="eye">Learning Groups based on MAP Data</div><h1>'+esc(D.title)+(D.sec?"":"")+'</h1><div class="meta">'+meta.join("")+'</div></div><div class="tools"><button class="btn" onclick="window.print()">🖨 Print</button></div></header>';
    var total=D.groups.reduce(function(a,g){return a+((g&&g.st)||[]).length},0)+D.miss.length;
    html+='<div class="cuts"><span class="t">'+(D.grade?"Grade "+esc(D.grade)+" ":"")+(D.season?esc(D.season)+" ":"")+'cut-off scores:</span><span>'+esc(D.cuts||"—")+'</span>'+
      G.map(function(g,i){var n=((D.groups[i]||{}).st||[]).length;return '<span class="chip" style="--gc:'+g.c+'"><i></i>'+g.k+" "+n+"</span>"}).join("")+
      '<span style="margin-left:auto;color:var(--muted)">'+total+' students</span></div>';
    html+='<div class="grid">'+G.map(function(g,i){
      var o=D.groups[i]||{st:[]},st=(o.st||[]).slice().sort(function(a,b){return (+a[2]||0)-(+b[2]||0)});
      var info=[];
      if(o.range)info.push("<span>RIT range: <b>"+esc(o.range)+"</b></span>");
      if(o.skill)info.push("<span>Skill: <b>"+esc(o.skill)+"</b></span>");
      if(o.now)info.push("<span>Today’s questions: <b>"+esc(o.now)+"</b>"+(o.home?" · Home: <b>"+esc(o.home)+"</b>":"")+"</span>");
      return '<section class="grp" style="--gc:'+g.c+';--gf:'+g.f+';--gb:'+g.b+'"><div class="grp-h"><h2>'+g.k+(i===1?'<span class="star">⭐ 1:1 support</span>':"")+'</h2><span class="n">'+st.length+" student"+(st.length===1?"":"s")+"</span></div>"+
        (info.length?'<div class="grp-i">'+info.join("")+"</div>":"")+
        (st.length?'<table><thead><tr><th>#</th><th>Student</th><th>K-number</th><th class="num">RIT</th></tr></thead><tbody>'+
          st.map(function(x,j){return "<tr><td class=\"i\">"+(j+1)+"</td><td>"+esc(x[0])+"</td><td>"+esc(x[1]||"—")+'</td><td class="num">'+esc(x[2])+"</td></tr>"}).join("")+"</tbody></table>"
          :'<div class="grp-i" style="background:#fff">No students in this group.</div>')+"</section>";
    }).join("")+"</div>";
    if(D.miss.length)html+='<div class="miss"><b>Not placed yet</b> (no RIT in this area): '+esc(D.miss.join(", "))+"</div>";
    app.innerHTML=html;
  }
  window.addEventListener("hashchange",render);render();
})();
</script>
</body>
</html>
