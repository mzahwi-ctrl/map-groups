<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Learning Groups based on MAP Data</title>
<style>
  :root{--ink:#17202B;--muted:#5A6576;--bg:#F4F5F7;--card:#fff;--line:#E1E4E8;--navy:#1D2B5C}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.3}
  main{font-size:var(--fs,15px);max-width:1800px;margin:0 auto;padding:.6em .8em;display:flex;flex-direction:column;gap:.5em}
  .head{background:var(--navy);color:#fff;border-radius:.7em;padding:.45em .9em;display:flex;flex-wrap:wrap;gap:.3em 1.2em;align-items:center;justify-content:space-between}
  .head .ttl{display:flex;align-items:baseline;gap:.7em;flex-wrap:wrap}
  .head h1{margin:0;font-size:1.6em;line-height:1.1}
  .head .eye{font-size:.72em;letter-spacing:.1em;text-transform:uppercase;opacity:.85;font-weight:700}
  .head .meta{display:flex;flex-wrap:wrap;gap:.15em 1.1em;font-size:.88em;width:100%}
  .head .meta b{color:#FFD86B;font-weight:700}
  .btn{border:0;border-radius:.5em;background:#fff;color:var(--navy);font:700 .85em inherit;padding:.4em .9em;cursor:pointer}
  .cuts{background:var(--card);border:1px solid var(--line);border-radius:.6em;padding:.35em .8em;display:flex;flex-wrap:wrap;gap:.3em 1em;align-items:center;font-size:.85em}
  .cuts .t{font-weight:700}
  .chip{display:inline-flex;align-items:center;gap:.35em}
  .chip i{width:.8em;height:.8em;border-radius:.2em;background:var(--gc)}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.55em;align-items:start}
  .grp{background:var(--card);border:2px solid var(--gc);border-radius:.7em;overflow:hidden}
  .grp-h{background:var(--gc);color:var(--gf);padding:.3em .7em;display:flex;justify-content:space-between;align-items:center;gap:.5em}
  .grp-h h2{margin:0;font-size:1.12em;white-space:nowrap}
  .grp-h .n{background:#fff;color:#111;border-radius:99px;padding:.05em .6em;font-weight:800;font-size:.8em;white-space:nowrap}
  .grp-i{padding:.35em .7em;font-size:.76em;border-bottom:1px solid var(--line);background:var(--gb);display:flex;flex-direction:column;gap:.1em}
  .grp-i b{color:#111}
  table{width:100%;border-collapse:collapse;font-size:.86em}
  th{text-align:left;font-size:.78em;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:.25em .5em;border-bottom:2px solid var(--line)}
  td{padding:.2em .5em;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  td.nm{white-space:normal}
  tr:last-child td{border-bottom:0}
  tbody tr:nth-child(even){background:color-mix(in srgb,var(--gb) 55%,#fff)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  td.num{font-weight:800}
  td.i{color:var(--muted);width:1.6em}
  .star{font-size:.62em;font-weight:700;background:#fff;color:#7A5A00;border-radius:99px;padding:.05em .5em;margin-left:.35em;vertical-align:middle}
  .miss{background:var(--card);border:1px dashed #999;border-radius:.6em;padding:.35em .8em;font-size:.82em}
  .msg{background:var(--card);border-radius:12px;padding:20px;color:var(--muted)}
  footer{color:var(--muted);font-size:11px;text-align:center;padding:4px 0 8px}
  @media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:560px){.grid{grid-template-columns:1fr}}
  @media print{
    @page{size:A4 landscape;margin:7mm}
    body{background:#fff}footer,.btn{display:none}
    main{max-width:none;padding:0;font-size:var(--pfs,12px)}
    .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
    .head,.grp,.grp-h,.grp-i,.chip i,tbody tr{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .grp{break-inside:avoid}
  }
</style>
</head>
<body>
<main id="app"><div class="msg">Open this page from the “Learning Groups based on MAP Data” link in a Weekly Plan.</div></main>
<footer>DSK Math Arena · Dubai Schools Al Khawaneej</footer>
<script>
(function(){
  var G=[
    {k:"Foundations",c:"#D23A30",f:"#fff",b:"#FCEDEC"},
    {k:"Developing",c:"#F2C82A",f:"#2B1F00",b:"#FEF8E1"},
    {k:"Proficient",c:"#2F8A3A",f:"#fff",b:"#EAF5EC"},
    {k:"Advanced",c:"#3A6FB0",f:"#fff",b:"#EAF0F8"}];
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function decode(s){
    s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";
    var bin=atob(s),bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function gi(name){name=String(name||"").toLowerCase();for(var i=0;i<4;i++)if(name.indexOf(G[i].k.toLowerCase())===0)return i;return -1}
  /* older links: {k:'MAP GROUPS', s, h, l:[lines]} */
  function fromLegacy(d){
    var out={sub:d.s||"",ses:d.h||"",groups:[[],[],[],[]].map(function(){return{st:[]}}),miss:[]};
    (d.l||[]).forEach(function(line){
      line=String(line);
      if(/^Not placed yet/i.test(line)){out.miss=line.replace(/^[^:]*:\s*/,"").split(/,\s*/);return}
      var p=line.split(" · ");
      var m=p[0].match(/^([A-Za-z]+):\s*(.*)$/);
      if(m&&gi(m[1])>-1&&p.length>=3&&/^RIT /.test(p[p.length-1])){
        out.groups[gi(m[1])].st.push([m[2],p[1]==="—"?"":p[1],p[p.length-1].replace(/^RIT\s*/,"")]);return}
      var g=gi(p[0].split(" ")[0]);if(g<0)return;var o=out.groups[g];
      p.slice(1).forEach(function(x){
        if(/^RIT /.test(x))o.range=x.replace(/^RIT\s*/,"");
        else if(/^Skill:/.test(x))o.skill=x.replace(/^Skill:\s*/,"");
        else if(/^Today:/.test(x))o.now=x.replace(/^Today:\s*/,"");
        else if(/^Home:/.test(x))o.home=x.replace(/^Home:\s*/,"");
      });
    });
    var cm=out.sub.match(/cut-offs (.*)$/);if(cm){out.cuts=cm[1];out.sub=out.sub.replace(/\s*·\s*Grade \d+ cut-offs.*$/,"")}
    var gm=d.s&&d.s.match(/Grade (\d+) cut-offs/);if(gm)out.grade=gm[1];
    out.title=out.sub.split(" · ")[0]||"Class";
    return out;
  }
  /* current links: {v:2, c, sec, unit, area, season, grade, teacher, no, date, topic, cuts:[a,b,c], g:[{range,skill,now,home,st:[[n,k,r]]}], miss:[]} */
  function fromV2(d){
    var sub=[d.unit,d.area,d.season?"MAP "+d.season:""].filter(Boolean).join(" · ");
    return {title:d.c,sec:d.sec,sub:sub,area:d.area,unit:d.unit,teacher:d.teacher,grade:d.grade,season:d.season,
      ses:"Session "+(d.no||"")+(d.date?" · "+d.date:"")+(d.topic?" · "+d.topic:""),
      cuts:d.cuts&&d.cuts.length===3?("41st "+d.cuts[0]+", 61st "+d.cuts[1]+", 81st "+d.cuts[2]):"",
      groups:(d.g||[]).map(function(x){return x||{st:[]}}),miss:d.miss||[]};
  }
  function render(){
    var app=document.getElementById("app"),h=location.hash.slice(1);if(!h)return;
    var d;try{d=decode(h)}catch(e){app.innerHTML='<div class="msg">This link could not be read. Download the Weekly Plan again from DSK Math Arena.</div>';return}
    var D=d.v===2?fromV2(d):fromLegacy(d);
    document.title="Learning Groups – "+(D.title||"MAP");
    var meta=[];
    if(D.sec)meta.push("<span>"+esc(D.sec)+"</span>");
    if(D.area)meta.push("<span>Instructional area: <b>"+esc(D.area)+"</b></span>");
    if(D.unit)meta.push("<span>"+esc(D.unit)+"</span>");
    if(!D.area&&D.sub)meta.push("<span>"+esc(D.sub)+"</span>");
    if(D.teacher)meta.push("<span>Teacher: <b>"+esc(D.teacher)+"</b></span>");
    if(D.ses)meta.push("<span>"+esc(D.ses)+"</span>");
    var html='<header class="head"><div class="ttl"><h1>'+esc(D.title)+'</h1><span class="eye">Learning Groups based on MAP Data</span></div><button class="btn" onclick="window.print()">🖨 Print</button><div class="meta">'+meta.join("")+'</div></header>';
    var total=D.groups.reduce(function(a,g){return a+((g&&g.st)||[]).length},0)+D.miss.length;
    html+='<div class="cuts"><span class="t">'+(D.grade?"Grade "+esc(D.grade)+" ":"")+(D.season?esc(D.season)+" ":"")+'cut-off scores:</span><span>'+esc(D.cuts||"—")+'</span>'+
      G.map(function(g,i){var n=((D.groups[i]||{}).st||[]).length;return '<span class="chip" style="--gc:'+g.c+'"><i></i>'+g.k+" "+n+"</span>"}).join("")+
      '<span style="margin-left:auto;color:var(--muted)">'+total+' students</span></div>';
    html+='<div class="grid">'+G.map(function(g,i){
      var o=D.groups[i]||{st:[]},st=(o.st||[]).slice().sort(function(a,b){return (+a[2]||0)-(+b[2]||0)});
      var info=[];
      if(o.range)info.push("<span>RIT range: <b>"+esc(o.range)+"</b></span>");
      if(o.skill)info.push("<span>Skill: <b>"+esc(o.skill)+"</b></span>");
      if(o.now)info.push("<span>Today’s questions: <b>"+esc(o.now)+"</b>"+(o.home?" · Home: <b>"+esc(o.home)+"</b>":"")+"</span>");
      return '<section class="grp" style="--gc:'+g.c+';--gf:'+g.f+';--gb:'+g.b+'"><div class="grp-h"><h2>'+g.k+(i===1?'<span class="star">⭐ 1:1 support</span>':"")+'</h2><span class="n">'+st.length+" student"+(st.length===1?"":"s")+"</span></div>"+
        (info.length?'<div class="grp-i">'+info.join("")+"</div>":"")+
        (st.length?'<table><thead><tr><th>#</th><th>Student</th><th>K-No.</th><th class="num">RIT</th></tr></thead><tbody>'+
          st.map(function(x,j){return "<tr><td class=\"i\">"+(j+1)+"</td><td class=\"nm\">"+esc(x[0])+"</td><td>"+esc(x[1]||"—")+'</td><td class="num">'+esc(x[2])+"</td></tr>"}).join("")+"</tbody></table>"
          :'<div class="grp-i" style="background:#fff">No students in this group.</div>')+"</section>";
    }).join("")+"</div>";
    if(D.miss.length)html+='<div class="miss"><b>Not placed yet</b> (no RIT in this area): '+esc(D.miss.join(", "))+"</div>";
    app.innerHTML=html;fit();
  }
  /* shrink the text until everything fits on one screen (and on one A4 landscape page when printing) */
  function fitTo(prop,maxH,width,from){
    var app=document.getElementById("app"),fs=from;app.style.setProperty(prop,fs+"px");
    if(width&&window.innerWidth<=900)return;
    while(app.scrollHeight>maxH&&fs>8){fs-=0.5;app.style.setProperty(prop,fs+"px")}
  }
  function fit(){fitTo("--fs",window.innerHeight-24,true,Math.min(17,Math.max(13,window.innerWidth/95)))}
  var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(fit,120)});
  window.addEventListener("beforeprint",function(){var app=document.getElementById("app");app.style.setProperty("--fs",app.style.getPropertyValue("--pfs")||"12px")});
  window.addEventListener("afterprint",fit);
  /* print size: A4 landscape printable area 283mm x 196mm at 96 dpi; measured on a 1070px-wide layout */
  function printSize(){var app=document.getElementById("app"),w=app.style.width;app.style.width="1070px";var fs=16;app.style.setProperty("--fs",fs+"px");
    while(app.scrollHeight>735&&fs>7){fs-=0.5;app.style.setProperty("--fs",fs+"px")}app.style.width=w;app.style.setProperty("--pfs",fs+"px");fit()}
  window.addEventListener("hashchange",render);render();if(location.hash)printSize();window.addEventListener("hashchange",printSize);
})();
</script>
</body>
</html>
